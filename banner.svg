<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.29  0 0 0 0 0.87  0 0 0 0 0.50  0 0 0 1 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 0.97  0 0 0 0.9 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="900" height="1" fill="rgba(0,0,0,0.15)"/>
    </pattern>
    <style>
      @keyframes blink {
        0%, 49.9% { opacity: 1; }
        50%, 100%  { opacity: 0; }
      }
      @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .cursor  { animation: blink 1s step-end infinite; }
      .l1 { animation: fadeSlide 0.35s ease 0.1s both; }
      .l2 { animation: fadeSlide 0.35s ease 0.55s both; }
      .l3 { animation: fadeSlide 0.35s ease 1.0s both; }
      .l4 { animation: fadeSlide 0.35s ease 1.45s both; }
      .l5 { animation: fadeSlide 0.35s ease 1.9s both; }
    </style>
  </defs>

  <!-- Outer background -->
  <rect width="900" height="280" rx="14" fill="url(#bgGrad)"/>

  <!-- Background ghost code — decorative only -->
  <g opacity="0.035" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4ade80">
    <text x="8"  y="18">01001000 01100101 01101100 01101100 01101111 00100000 01010111 01101111 01110010 01101100 01100100</text>
    <text x="8"  y="34">const greet = (name) =&gt; `Hello, ${name}! Ready to build something great?`;</text>
    <text x="8"  y="50">import { passion, creativity, coffee } from 'developer';</text>
    <text x="8"  y="248">while (alive) { learn(); build(); ship(); refactor(); } // infinite loop — feature, not bug</text>
    <text x="8"  y="264">git commit -m "feat: pushed boundaries again" &amp;&amp; git push origin main</text>
  </g>

  <!-- Terminal window body -->
  <rect x="28" y="18" width="844" height="244" rx="9" fill="#0d1117" stroke="#1a2535" stroke-width="1.2"/>

  <!-- Title bar fill -->
  <rect x="28" y="18" width="844" height="36" rx="9" fill="#151e2e"/>
  <!-- Cover bottom-rounded corners of title bar -->
  <rect x="28" y="42" width="844" height="12" fill="#151e2e"/>
  <!-- Title bar bottom border -->
  <line x1="28" y1="54" x2="872" y2="54" stroke="#1d2d42" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="57"  cy="36" r="7" fill="#ff5f57"/>
  <circle cx="79"  cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="101" cy="36" r="7" fill="#28c840"/>

  <!-- Title bar label -->
  <text x="450" y="41" font-family="'Courier New', Courier, monospace" font-size="12"
        fill="#2e4060" text-anchor="middle" letter-spacing="0.8">tushar20121907: ~ — zsh</text>

  <!-- ─── Terminal Lines ─── -->

  <!-- $ echo "Hello, World!" -->
  <g class="l1">
    <text x="56" y="90" font-family="'Courier New', Courier, monospace" font-size="14" fill="#4ade80" filter="url(#greenGlow)">$</text>
    <text x="72" y="90" font-family="'Courier New', Courier, monospace" font-size="14" fill="#c9d7e8">echo <tspan fill="#38bdf8">"Hello, World!"</tspan></text>
  </g>

  <!-- output: Hello, World! -->
  <g class="l2">
    <text x="56" y="115" font-family="'Courier New', Courier, monospace" font-size="13" fill="#2e4a62">&#9658;</text>
    <text x="74" y="115" font-family="'Courier New', Courier, monospace" font-size="15" fill="#f0f6ff" letter-spacing="1">Hello, World!</text>
  </g>

  <!-- $ echo $NAME -->
  <g class="l3">
    <text x="56" y="152" font-family="'Courier New', Courier, monospace" font-size="14" fill="#4ade80" filter="url(#greenGlow)">$</text>
    <text x="72" y="152" font-family="'Courier New', Courier, monospace" font-size="14" fill="#c9d7e8">echo <tspan fill="#38bdf8">$NAME</tspan></text>
  </g>

  <!-- output: stylised name -->
  <g class="l4">
    <text x="56" y="185" font-family="'Courier New', Courier, monospace" font-size="13" fill="#2e4a62">&#9658;</text>
    <text x="74" y="188" font-family="'Courier New', Courier, monospace" font-size="26" fill="#4ade80" filter="url(#greenGlow)" letter-spacing="10" font-weight="bold">Hey! I am Tushar</text>
  </g>

  <!-- Final prompt + blinking cursor -->
  <g class="l5">
    <text x="56" y="233" font-family="'Courier New', Courier, monospace" font-size="14" fill="#4ade80" filter="url(#greenGlow)">$</text>
    <rect class="cursor" x="72" y="220" width="9" height="16" fill="#4ade80" rx="1"/>
  </g>

  <!-- Scanlines overlay -->
  <rect x="28" y="55" width="844" height="207" fill="url(#scanlines)" opacity="0.6"/>

  <!-- Corner vignette for depth -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
  </radialGradient>
  <rect width="900" height="280" rx="14" fill="url(#vignette)"/>
</svg>